apiVersion: v1
kind: ConfigMap
metadata:
  name: doc-registry-usvc-config
  labels:
    helm.sh/chart: doc-registry-usvc-0.1.0
    app.kubernetes.io/name: doc-registry-usvc
    app.kubernetes.io/instance: doc-registry-usvc
    app.kubernetes.io/version: "v0.1"
    app.kubernetes.io/managed-by: Helm
data:
  DOC_REGISTRY_HOST: "0.0.0.0"
  DOC_REGISTRY_PORT: "6200"
  # Points to Redis in the same docbot namespace
  DOC_REGISTRY_REDIS_URL: "redis://redis-vector-db.docbot.svc.cluster.local:6379"
  DOC_REGISTRY_REDIS_HASH_PREFIX: "docbot:registry:"
  FEEDBACK_STREAM: "docbot:feedback_log"
  OPEA_LOGGER_LEVEL: "INFO"
---
# Source: doc-registry-usvc/templates/service.yaml
# Copyright (C) 2024 Intel Corporation
# SPDX-License-Identifier: Apache-2.0

apiVersion: v1
kind: Service
metadata:
  name: doc-registry-svc
  labels:
    helm.sh/chart: doc-registry-usvc-0.1.0
    app.kubernetes.io/name: doc-registry-usvc
    app.kubernetes.io/instance: doc-registry-usvc
    app.kubernetes.io/version: "v0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 6200
      targetPort: 6200
      protocol: TCP
      name: doc-registry-usvc
  selector:
    app.kubernetes.io/name: doc-registry-usvc
    app.kubernetes.io/instance: doc-registry-usvc
---
# Source: doc-registry-usvc/templates/deployment.yaml
# Copyright (C) 2024 Intel Corporation
# SPDX-License-Identifier: Apache-2.0

apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-registry-usvc
  labels:
    helm.sh/chart: doc-registry-usvc-0.1.0
    app.kubernetes.io/name: doc-registry-usvc
    app.kubernetes.io/instance: doc-registry-usvc
    app.kubernetes.io/version: "v0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doc-registry-usvc
      app.kubernetes.io/instance: doc-registry-usvc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doc-registry-usvc
        app.kubernetes.io/instance: doc-registry-usvc
    spec:
      securityContext: {}
      initContainers:
        - name: wait-for-redis
          image: redis:alpine
          command:
            - sh
            - -c
            - |
              if [ -z "$DOC_REGISTRY_REDIS_URL" ]; then
                echo "DOC_REGISTRY_REDIS_URL is not set"; exit 1
              fi
              REDIS_HOST=$(echo $DOC_REGISTRY_REDIS_URL | sed 's|redis://||' | cut -d: -f1)
              REDIS_PORT=$(echo $DOC_REGISTRY_REDIS_URL | sed 's|redis://||' | cut -d: -f2)
              until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do
                echo "Waiting for Redis at $REDIS_HOST:$REDIS_PORT..."
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: doc-registry-usvc-config
      containers:
        - name: doc-registry-usvc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          image: "localhost:5000/opea/doc-registry:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 6200
              protocol: TCP
          envFrom:
            - configMapRef:
                name: doc-registry-usvc-config
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 6200
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 6200
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
